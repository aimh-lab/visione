version: "3.8"

services:
  media-resolver:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: media-resolver
    environment:
      MEDIA_MANIFEST_PATH: /manifest/media.sqlite
      MEDIA_ALLOWED_ROOTS: /data1:/data2
    volumes:
      - ./generated:/manifest:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  nginx-video:
    image: openresty/openresty:1.31-bullseye-fat
    container_name: nginx-video-server
    depends_on:
      media-resolver:
        condition: service_healthy
    ports:
      - "3333:80"
      # - "43333:443"
    volumes:
      - /data1/lsc-common-data:/media/data1/lsc-common-data:ro
      - /data1/v3c-common-data:/media/data1/v3c-common-data:ro
      - /data1/v3c-collection:/media/data1/v3c-collection:ro
      - /data2/v3c-2026-data:/media/data2/v3c-2026-data:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    restart: unless-stopped
