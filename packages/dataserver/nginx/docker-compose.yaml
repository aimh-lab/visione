version: '3.8'

services:
  nginx-video:
    image: openresty/openresty:1.31-bullseye-fat
    container_name: nginx-video-server
    ports:
      - "3333:80"
      - "43333:443"
    volumes:
      # Mount your local videos folder to Nginx's web root (read-only)
      - /data1/lsc-collection:/data/lsc-collection:ro
      - /data1/lsc-common-data:/data/lsc-common-data:ro
      - /data1/v3c-common-data:/data/v3c-common-data:ro
      - /data1/v3c-collection:/data/v3c-collection:ro
      # Mount the custom configuration file (read-only)
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    restart: unless-stopped