server {
    listen 80;
    listen 443 ssl;
    server_name localhost;
 
    # Percorsi dei certificati SSL nel container
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    add_header Access-Control-Allow-Origin "*" always;

    # /lsc26/<id>/<element_type>  e.g. /lsc26/20190101_205237.webp/images
    # id format: YYYYMMDDxxx  → mapped to base_path/YYYY/MM/DD/<id>
    location ~ "^/lsc26/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" {
        # 1. Define the base directory
        root /data/lsc-common-data/lsc26-data/LSC26-unzipped;
        
        # 2. Rewrite the internal URI to match your folder structure
        rewrite "^/lsc26/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" /$2/$3/$4/$1 break;
        
        autoindex off;
    }

    # /lsc/<id>/<element_type>  e.g. /lsc/20190425_173200_000.jpg/images
    # id format: YYYYMMDDxxx  → mapped to base_path/YYYYMM/DD/<id>
    location ~ "^/lsc/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" {
        # 1. Define the base directory
        root /data/lsc-common-data/original;
        
        # 2. Rewrite the internal URI to match your folder structure
        rewrite "^/lsc/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" /$2$3/$4/$1 break;
        
        autoindex off;
    }

    # /v3c/19826/video?start=0.0&end=0.567
    # location ~ "^/v3c/(\d+)/video$" {
    #     set $vid $1;

    #     root /data/v3c-data;

    #     # Use Lua to mathematically determine the target folder
    #     set_by_lua_block $v3c_folder {
    #         -- Convert the Nginx variable $vid into a Lua number
    #         local id = tonumber(ngx.var.vid)
            
    #         -- Perform standard mathematical comparisons
    #         if id <= 7485 then 
    #             return "V3C1"
    #         elseif id <= 17235 then 
    #             return "V3C2"
    #         else 
    #             return "V3C3"
    #         end
    #     }

    #     # Rewrite the URI using the folder Lua just picked
    #     rewrite ^ /raw-data/$v3c_folder/videos/$vid/$vid.mp4 break;

    #     # The Nginx MP4 module still handles ?start=x & ?end=y perfectly
    #     mp4;
    #     mp4_start_key_frame   on;
    #     mp4_buffer_size       1m;
    #     mp4_max_buffer_size   5m;
        
    #     autoindex off;
    # }

    # Temporary V3C1+2 videos
    location ~ "^/v3c/(\d+)/video$" {
        set $vid $1;

        root /data/v3c-common-data;

        # Rewrite the URI using the folder Lua just picked
        try_files /videos/$vid.mp4 /videos-converted-to-mp4/$vid.mp4 =404;

        # The Nginx MP4 module still handles ?start=x & ?end=y perfectly
        mp4;
        mp4_start_key_frame   on;
        mp4_buffer_size       1m;
        mp4_max_buffer_size   5m;
        
        autoindex off;
    }

    # Temporary V3C1+2 images
    location ~ "^/v3c/(\d+)/(\d+)/image$" {
        set $vid $1;
        set $shot $2;

        root /data/v3c-collection;

        # Rewrite the URI using the folder Lua just picked
        rewrite ^ /selected-frames/$vid/$vid-$shot.jpg break;
        
        autoindex off;
    }
    
    # Discovery endpoint: returns supported collections and their media types
    location = /discovery {
        default_type application/json;
        return 200 '{"lsc26":["images"], "lsc":["images"]}';
    }

    # Standard 404 handler
    error_page 404 /404.html;
}