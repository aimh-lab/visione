server {
    listen 80;
    # listen 443 ssl;
    server_name localhost;

    #ssl_certificate /etc/nginx/certs/nginx.crt;
    #ssl_certificate_key /etc/nginx/certs/nginx.key;

    #add_header Access-Control-Allow-Origin "*" always;

    location = /discovery {
        proxy_pass http://media-resolver:8000/discovery;
    }

    location = /health {
        proxy_pass http://media-resolver:8000/health;
    }

    # Physical paths are accepted only from the trusted resolver through
    # X-Accel-Redirect. /media mirrors the host's /data1 and /data2 roots.
    location ^~ /_media/image/ {
        internal;
        alias /media/;
        autoindex off;
    }

    location ^~ /_media/video/ {
        internal;
        alias /media/;

        mp4;
        mp4_start_key_frame on;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;

        autoindex off;
    }

    # Collection, resource ID, element type, and filesystem layout are all
    # resolved from the generated manifest rather than from nginx rules.
    location ~ "^/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)$" {
        proxy_pass http://media-resolver:8000/resolve/$1/$2/$3$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    error_page 404 /404.html;
}
