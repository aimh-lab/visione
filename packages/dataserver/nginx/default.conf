server {
    listen 80;
    listen 443 ssl;
    server_name localhost;
 
    # Percorsi dei certificati SSL nel container
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    add_header Access-Control-Allow-Origin "*" always;

    # /lsc26/<id>/<element_type>  e.g. /lsc26/20190101_205237.webp/images
    # id format: YYYYMMDDxxx  → mapped to base_path/YYYY/MM/DD/<id>
    location ~ "^/lsc26/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" {
        # 1. Define the base directory
        root /data/lsc-common-data/lsc26-data/LSC26-unzipped;
        
        # 2. Rewrite the internal URI to match your folder structure
        rewrite "^/lsc26/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" /$2/$3/$4/$1 break;
        
        autoindex off;
    }

    # /lsc/<id>/<element_type>  e.g. /lsc/20190425_173200_000.jpg/images
    # id format: YYYYMMDDxxx  → mapped to base_path/YYYYMM/DD/<id>
    location ~ "^/lsc/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" {
        # 1. Define the base directory
        root /data/lsc-common-data/original;
        
        # 2. Rewrite the internal URI to match your folder structure
        rewrite "^/lsc/((\d{4})(\d{2})(\d{2})[^/]+)/([^/]+)$" /$2$3/$4/$1 break;
        
        autoindex off;
    }
    
    # Discovery endpoint: returns supported collections and their media types
    location = /discovery {
        default_type application/json;
        return 200 '{"lsc26":["images"], "lsc":["images"]}';
    }

    # Standard 404 handler
    error_page 404 /404.html;
}