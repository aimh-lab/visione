defaults:
  - loader: ???
  - common
  - _self_

host: localhost
port: 8000
default_k: 100
fts_language: "english"

index_query_options:
  ef_search: 1000
  iterative_scan: "relaxed_order"
  max_scan_tuples: 150000
  random_page_cost: 0.2
  # jit: "off"

translate:
  model: "Qwen/Qwen3.8-27B"
  base_url: "http://localhost:3456/v1"
  api_key: "ollama"
  reasoning: false

llm_query:
  model: "Qwen/Qwen3.8-27B"
  base_url: "http://localhost:3456/v1"
  api_key: "ollama"
  temperature: 0
  reasoning: false
  default_model: "qwen_embedding_8B_image"
  leaf_k: 100000
  final_k: 1000

qa:
  model: "Qwen/Qwen3.8-27B"
  base_url: "http://localhost:11545/v1"
  api_key: "ollama"
  temperature: 0
  reasoning: false
  max_iterations: 5
  max_images_per_call: 18
  grouped_frames_per_video: 3
  max_grouped_videos: 6
  max_video_interval_seconds: 30
  default_model: "qwen_embedding_8B_video"
  debug: true

combined_retrieval_models:
  - "name": "smart (qwen + cliph)"
    "models": ["qwen_embedding_8B", "openclip_clip_vit_h_14"]
    "extended_k": 100000
    "modalities": ["text", "image"]